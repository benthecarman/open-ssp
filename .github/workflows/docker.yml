name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Override in repo Settings > Variables if the image owner differs.
  IMAGE_OWNER: ${{ vars.IMAGE_OWNER || github.repository_owner }}

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y libprotobuf-dev protobuf-compiler
      - run: rustup component add clippy
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SPARK_ADMIN_TOKEN: regtest-spark-admin-token
      LN_STREAM_IDLE_SECONDS: 95
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build pinned Spark SDK
        run: |
          cd vendor/spark/sdks/js
          corepack enable
          yarn install --no-immutable
          yarn build:sdk
      - name: Run full regtest suite
        run: ./e2e/e2e.sh
      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.regtest.yml down --volumes --remove-orphans

  lightning-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SPARK_ADMIN_TOKEN: regtest-spark-admin-token
      BREEZ_E2E_PROJECT_NAME: open-ssp-breez-e2e-ci
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libprotobuf-dev protobuf-compiler
      - name: Check Rust regtest runner
        run: |
          cargo test --locked --manifest-path e2e/breez/Cargo.toml
          cargo clippy --locked --manifest-path e2e/breez/Cargo.toml --all-targets -- -D warnings
      - name: Run Breez Lightning regtest
        run: cargo regtest test
      - name: Stop Lightning test stack
        if: always()
        run: cargo regtest --project "$BREEZ_E2E_PROJECT_NAME" reset

  ssp:
    needs: [rust, e2e, lightning-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/open-ssp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=master,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ssp.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
