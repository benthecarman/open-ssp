name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Override in repo Settings > Variables if the image owner differs.
  IMAGE_OWNER: ${{ vars.IMAGE_OWNER || github.repository_owner }}

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y libprotobuf-dev protobuf-compiler
      - run: rustup component add clippy
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SPARK_ADMIN_TOKEN: regtest-spark-admin-token
      BREEZ_E2E_PROJECT_NAME: open-ssp-breez-e2e-ci
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
          workspaces: |
            . -> target
            e2e/breez -> target
      - uses: actions/setup-go@v6
        with:
          go-version-file: vendor/spark/spark/go.mod
          cache-dependency-path: vendor/spark/spark/go.sum
      - name: Cache native tools and service builds
        uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            .regtest/native-tools
            .regtest/native-build
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Install native build and database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libzmq3-dev \
            libprotobuf-dev protobuf-compiler postgresql libpq-dev unzip
      - name: Check Rust regtest runner
        run: |
          cargo test --locked --manifest-path e2e/breez/Cargo.toml
          cargo clippy --locked --manifest-path e2e/breez/Cargo.toml --all-targets -- -D warnings
      - name: Build native test services
        run: cargo regtest build
      - name: Test embedded LDK payments and restart recovery
        run: cargo test --locked embedded_regtest_payments_and_restart -- --ignored
      - name: Save native builds before acceptance
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .regtest/native-tools
            .regtest/native-build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Run Breez SDK regtest
        run: |
          set -o pipefail
          cargo regtest test --no-build --keep 2>&1 | tee e2e.log
      - name: Upload test timings and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          include-hidden-files: true
          path: |
            e2e.log
            .regtest/*/native/*.log
          if-no-files-found: ignore
      - name: Stop SDK test stack
        if: always()
        run: cargo regtest --project "$BREEZ_E2E_PROJECT_NAME" reset

  ssp:
    needs: [rust, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/open-ssp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=master,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ssp.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ssp
          cache-to: type=gha,scope=ssp,mode=max
