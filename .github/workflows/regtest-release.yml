name: regtest-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version: vMAJOR.MINOR.PATCH[-prerelease]'
        required: true
        type: string
      publish:
        description: 'Publish to the existing regtest-VERSION tag after validation'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: regtest-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PGBIN: /usr/lib/postgresql/16/bin
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Validate version and publication ref
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_REF" == "refs/tags/regtest-$VERSION" ]]
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: vendor/spark/spark/go.mod
          cache-dependency-path: vendor/spark/spark/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: regtest-bundle-ubuntu24
          workspaces: |
            . -> target
            e2e/breez -> target
      - uses: actions/cache@v4
        with:
          path: |
            .regtest/native-tools
            .regtest/native-build
            .regtest/native-sources
          key: regtest-bundle-ubuntu24-${{ github.sha }}
          restore-keys: regtest-bundle-ubuntu24-
      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libzmq3-dev \
            libprotobuf-dev protobuf-compiler libclang-dev postgresql-16 libpq-dev \
            bubblewrap openssl
          # Ubuntu's AppArmor restriction otherwise blocks bubblewrap's user namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check runner
        run: |
          cargo test --locked --manifest-path e2e/breez/Cargo.toml
          cargo clippy --locked --manifest-path e2e/breez/Cargo.toml --all-targets -- -D warnings
      - name: Build bundle
        run: |
          python3 scripts/regtest/package.py --version "$VERSION"
          python3 -c 'import glob,json; assert not json.load(open(glob.glob("dist/*.manifest.json")[0]))["source_dirty"]'
          cd dist
          sha256sum -c "open-ssp-regtest-$VERSION-linux-x86_64.sha256"
      - name: Validate read-only extracted bundle without source or network
        run: |
          set -o pipefail
          python3 scripts/regtest/validate.py \
            "dist/open-ssp-regtest-$VERSION-linux-x86_64.tar.gz" \
            --work-dir .regtest/bundle-validation 2>&1 | tee bundle-validation.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regtest-validation-${{ inputs.version }}
          include-hidden-files: true
          path: |
            bundle-validation.log
            .regtest/bundle-validation/state/logs/**/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: open-ssp-regtest-${{ inputs.version }}-linux-x86_64
          compression-level: 0
          path: dist/*
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: open-ssp-regtest-${{ inputs.version }}-linux-x86_64
          path: dist
      - name: Publish explicitly requested release
        run: |
          gh release create "regtest-$VERSION" dist/* --verify-tag \
            --title "Native regtest $VERSION" \
            --notes 'Linux x86_64 native fixture. See the bundled README and manifest for the CLI, runtime prerequisites, component revisions and integrity hashes.'
