[package]
name = "open-ssp"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "open-ssp"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
secp256k1 = { version = "0.29", features = ["global-context", "recovery"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
rand = "0.8"
thiserror = "1"
async-trait = "0.1"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
bip39 = { version = "2", features = ["rand"] }
bitcoin = "0.32"
lightning-invoice = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
spark-wallet = { git = "https://github.com/benthecarman/spark-sdk", rev = "4345469d40c665c0968fcba0af5797830e7a86a4" }
spark = { git = "https://github.com/benthecarman/spark-sdk", rev = "4345469d40c665c0968fcba0af5797830e7a86a4" }
subtle = "2"
ldk-server-client = { git = "https://github.com/lightningdevkit/ldk-server", package = "ldk-server-client" }

[dev-dependencies]
parking_lot = "0.12"

[features]
default = []
