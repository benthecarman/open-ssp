[package]
name = "open-ssp-breez-e2e"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bitcoin = "0.32"
breez-sdk-spark = { git = "https://github.com/breez/spark-sdk.git", rev = "c7eecfe670798a8b8332ce412044cbd49123687a", features = ["sqlite"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
